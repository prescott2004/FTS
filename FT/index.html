<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fourier Transform — Animated (p5.js)</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #0b0d10;
            color: #e6edf3;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        }

        #legend {
            position: absolute;
            left: 16px;
            top: 16px;
            background: rgba(20, 24, 28, 0.8);
            padding: 10px 12px;
            border-radius: 10px;
            line-height: 1.3;
            font-size: 12px;
        }

        code {
            background: rgba(255, 255, 255, 0.06);
            padding: 1px 4px;
            border-radius: 5px;
        }

        a {
            color: #8ab4f8;
            text-decoration: none;
        }

        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            background: #1b1f24;
            margin-right: 6px;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <div id="legend">
        <div style="margin-bottom:6px; font-weight:700">フーリエ変換の過程（連続FTの数値近似）</div>
        <div><span class="pill">左上</span>関数 <span style="opacity:.8">f(x)</span></div>
        <div><span class="pill">左下</span>複素平面での積分（回転するカーネル <span style="opacity:.8">e^{-i\,ωx}</span> によるベクトル和）</div>
        <div><span class="pill">右</span>周波数軸（ω）上に順次プロットされる |F(ω)| と Re/Im</div>
        <hr style="border:none; border-top:1px solid #2a3138; margin:8px 0">
        <div>操作: <code>1</code> ガウス, <code>2</code> ステップ, <code>3</code> 三角, <code>4</code> サイン波, <code>5</code> ノコギリ,
            <code>6</code> カスタム
        </div>
        <div>&nbsp;&nbsp;&nbsp;&nbsp;
            <code>SPACE</code> 一時停止/再開,
            <code>ESC</code> リセット,
            <code>[ / ]</code> 速度↓/↑,
            <code>- / =</code> ω範囲↓/↑,
            <code>Z</code> スケールHUD表示
        </div>
        <div>&nbsp;&nbsp;&nbsp;&nbsp;
            <code>A</code> |F(ω)| 表示/非表示,
            <code>R</code> Re 表示/非表示,
            <code>I</code> Im 表示/非表示
        </div>
    </div>
    <script type="module" src="script_main.js"></script>
</body>

</html>
