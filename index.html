<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abstract Lightscape Visualizer - p5.js</title>
    <!-- p5.js & p5.sound CDN -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.2.0/dist/p5.sound.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #05070a;
            color: #e6eef7;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
        }

        .ui {
            position: fixed;
            left: 12px;
            top: 12px;
            z-index: 10;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            background: rgba(8, 12, 16, .6);
            padding: 8px 10px;
            border: 1px solid #223;
            border-radius: 12px;
        }

        .btn,
        .select,
        .slider {
            background: #121a22;
            color: #e6eef7;
            border: 1px solid #2a3b4d;
            border-radius: 10px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .slider {
            width: 140px;
        }

        .hint {
            position: fixed;
            right: 12px;
            top: 12px;
            opacity: .75;
            font-size: 12px;
            text-align: right;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div class="ui">
        <button id="play" class="btn">▶ 再生 / 一時停止</button>
        <label class="btn" style="cursor:pointer;">📂 音声ファイル
            <input id="file" type="file" accept="audio/*" style="display:none;" />
        </label>
        <button id="mic" class="btn">🎙 マイク</button>
        <label>粒子</label><input id="pcount" type="range" min="500" max="20000" value="4000" step="100" class="slider" />
        <label>残像</label><input id="fade" type="range" min="0.02" max="0.2" value="0.06" step="0.01" class="slider" />
        <label>彩度</label><input id="sat" type="range" min="20" max="100" value="70" step="1" class="slider" />
    </div>
    <div class="hint">ドラッグ＆ドロップで音源OK / クリック: カラープリセット切替 / 右クリック: 波形HUD切替</div>

    <script src="script_main.js"></script>
</body>

</html>
